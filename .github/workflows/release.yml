name: Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT: senor-particle.xcodeproj
  SCHEME: senor-particle
  APP_NAME: Senor Particle
  BUILD_DIR: Build/CI
  ARCHIVE_PATH: Build/CI/Senor Particle.xcarchive
  EXPORT_PATH: Build/CI/export
  EXPORT_PLIST: exportOptions.plist
  APP_PATH: Build/CI/export/Senor Particle.app
  NOTARY_ZIP: Build/CI/SenorParticle-notarization.zip
  CHANGELOG_PATH: Build/CI/CHANGELOG.md
  BOM_PATH: Build/CI/BILL_OF_MATERIALS.md
  PACKAGE_DIR: Build/CI/package
  UPDATE_DIR: Build/CI/sparkle
  APPCAST_INPUT_DIR: Build/CI/sparkle/input
  APPCAST_PATH: Build/CI/sparkle/appcast.xml
  UPDATE_PUBLICATION_DIR: Build/CI/sparkle/publication
  UPDATE_RELEASE_TAG: sparkle-updates
  PACKAGE_CACHE_DIR: Build/SourcePackages
  PACKAGE_RESOLVED: senor-particle.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  DESTINATION: generic/platform=macOS

jobs:
  release:
    name: Build And Notarize Release App
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      update_archive_name: ${{ steps.metadata.outputs.update_archive_name }}
      update_notes_name: ${{ steps.metadata.outputs.update_notes_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Read Build Metadata
        id: metadata
        run: |
          set -euo pipefail
          BUILD_SETTINGS="$(xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE_DIR" \
            -showBuildSettings)"
          APP_VERSION="$(printf '%s\n' "$BUILD_SETTINGS" | awk '/MARKETING_VERSION/ { print $3; exit }')"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "MARKETING_VERSION must contain a version like 1.0 or 1.0.0" >&2
            exit 1
          fi
          DEVELOPMENT_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :teamID' "$EXPORT_PLIST")"
          RELEASE_NAME="senor-particle-v${APP_VERSION}"
          UPDATE_ARCHIVE_NAME="senor-particle-update-v${APP_VERSION}.zip"
          UPDATE_NOTES_NAME="senor-particle-update-v${APP_VERSION}.md"
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}"
            echo "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM"
            echo "RELEASE_NAME=$RELEASE_NAME"
            echo "ARTIFACT_ZIP=${BUILD_DIR}/${RELEASE_NAME}.zip"
            echo "UPDATE_ARCHIVE_NAME=$UPDATE_ARCHIVE_NAME"
            echo "UPDATE_NOTES_NAME=$UPDATE_NOTES_NAME"
          } >> "$GITHUB_ENV"
          {
            echo "app_version=$APP_VERSION"
            echo "release_name=$RELEASE_NAME"
            echo "update_archive_name=$UPDATE_ARCHIVE_NAME"
            echo "update_notes_name=$UPDATE_NOTES_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Building Senor Particle $APP_VERSION (${GITHUB_RUN_NUMBER})"

      - name: Validate Release Version
        run: |
          set -euo pipefail
          RELEASE_TAG="v${APP_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_TAG belongs to $TAG_COMMIT; increment MARKETING_VERSION" >&2
              exit 1
            fi
            echo "Release tag $RELEASE_TAG already identifies this commit; continuing retry"
          fi

      - name: Import Developer ID Certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64 secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD secret}"
          : "${APPLE_SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY secret}"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/senor-particle-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Clean Release Artifacts
        run: |
          set -euo pipefail
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

      - name: Resolve Package Dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE_DIR"
          test -x "$PACKAGE_CACHE_DIR/artifacts/sparkle/Sparkle/bin/generate_appcast"

      - name: Archive Release App
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE_DIR" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export Developer ID App
        run: |
          set -euo pipefail
          rm -rf "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"

      - name: Verify Exported App
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          EXECUTABLE_PATH="${APP_PATH}/Contents/MacOS/${APP_NAME}"
          EXECUTABLE_ARCHITECTURES="$(lipo -archs "$EXECUTABLE_PATH")"
          if [[ "$EXECUTABLE_ARCHITECTURES" != "arm64" ]]; then
            echo "Expected arm64 executable but found $EXECUTABLE_ARCHITECTURES" >&2
            exit 1
          fi

      - name: Create Notarization Zip
        run: |
          set -euo pipefail
          rm -f "$NOTARY_ZIP"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          ls -lh "$NOTARY_ZIP"

      - name: Submit For Notarization
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPSTORE_CONNECT_KEY_ID:?Missing APPSTORE_CONNECT_KEY_ID secret}"
          : "${APPSTORE_CONNECT_ISSUER_ID:?Missing APPSTORE_CONNECT_ISSUER_ID secret}"
          : "${APPSTORE_CONNECT_KEY_P8_BASE64:?Missing APPSTORE_CONNECT_KEY_P8_BASE64 secret}"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          NOTARIZATION_RESULT="$RUNNER_TEMP/notarization-result.json"
          printf '%s' "$APPSTORE_CONNECT_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          set +e
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPSTORE_CONNECT_KEY_ID" \
            --issuer "$APPSTORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 30m \
            --output-format json > "$NOTARIZATION_RESULT"
          NOTARIZATION_STATUS=$?
          set -e

          cat "$NOTARIZATION_RESULT"
          if [[ $NOTARIZATION_STATUS -ne 0 ]]; then
            SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$NOTARIZATION_RESULT" 2>/dev/null || true)"
            if [[ -n "$SUBMISSION_ID" ]]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY_PATH" \
                --key-id "$APPSTORE_CONNECT_KEY_ID" \
                --issuer "$APPSTORE_CONNECT_ISSUER_ID" || true
            fi
            exit "$NOTARIZATION_STATUS"
          fi

      - name: Staple Notarization Ticket
        run: |
          set -euo pipefail
          xcrun stapler staple "$APP_PATH"

      - name: Verify Notarized App
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl -a -vvv "$APP_PATH"

      - name: Generate Changelog And Bill Of Materials
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --exclude "v${APP_VERSION}-pre.*" 2>/dev/null || true)"
          {
            echo "# Changelog"
            echo
            echo "- version: ${APP_VERSION}"
            echo "- build: ${BUILD_NUMBER}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- branch: ${GITHUB_REF_NAME}"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "## Changes since ${PREVIOUS_TAG}"
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS_TAG}..HEAD"
            else
              echo "## Changes"
              git log --no-merges --pretty='- %s (%h)' HEAD
            fi
          } > "$CHANGELOG_PATH"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"
          XCODE_VERSION="$(xcodebuild -version | tr '\n' ' ')"
          SWIFT_VERSION="$(swift --version | head -n 1)"
          MACOS_VERSION="$(sw_vers -productVersion)"
          {
            echo "# Bill Of Materials"
            echo
            echo "- artifact: $(basename "$ARTIFACT_ZIP")"
            echo "- included app: Senor Particle.app"
            echo "- included changelog: CHANGELOG.md"
            echo "- included bill of materials: BILL_OF_MATERIALS.md"
            echo "- bundle identifier: ${BUNDLE_ID}"
            echo "- bundle version: ${BUNDLE_VERSION}"
            echo "- bundle build: ${BUNDLE_BUILD}"
            echo "- executable architectures: arm64"
            echo "- source commit: ${GITHUB_SHA}"
            echo "- source branch: ${GITHUB_REF_NAME}"
            echo "- runner image: macos-26"
            echo "- macos version: ${MACOS_VERSION}"
            echo "- xcode version: ${XCODE_VERSION}"
            echo "- swift version: ${SWIFT_VERSION}"
            echo
            echo "## Dependencies"
            jq -r '.pins[] | "- \(.identity): \(.state.version // .state.branch // .state.revision)"' "$PACKAGE_RESOLVED"
          } > "$BOM_PATH"
          ls -lh "$CHANGELOG_PATH" "$BOM_PATH"

      - name: Package App Artifact
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          ditto "$APP_PATH" "${PACKAGE_DIR}/Senor Particle.app"
          cp "$CHANGELOG_PATH" "${PACKAGE_DIR}/CHANGELOG.md"
          cp "$BOM_PATH" "${PACKAGE_DIR}/BILL_OF_MATERIALS.md"
          ARTIFACT_ABSOLUTE="$(pwd)/$ARTIFACT_ZIP"
          (
            cd "$PACKAGE_DIR"
            ditto -c -k . "$ARTIFACT_ABSOLUTE"
          )
          ls -lh "$ARTIFACT_ZIP"

      - name: Package Sparkle Update
        run: |
          set -euo pipefail
          rm -rf "$UPDATE_DIR"
          mkdir -p "$APPCAST_INPUT_DIR"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "${APPCAST_INPUT_DIR}/${UPDATE_ARCHIVE_NAME}"
          cp "$CHANGELOG_PATH" "${APPCAST_INPUT_DIR}/${UPDATE_NOTES_NAME}"
          ls -lh "${APPCAST_INPUT_DIR}/${UPDATE_ARCHIVE_NAME}" "${APPCAST_INPUT_DIR}/${UPDATE_NOTES_NAME}"

      - name: Download Existing Sparkle Updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "${APPCAST_INPUT_DIR}/${UPDATE_ARCHIVE_NAME}" "$RUNNER_TEMP/${UPDATE_ARCHIVE_NAME}"
          cp "${APPCAST_INPUT_DIR}/${UPDATE_NOTES_NAME}" "$RUNNER_TEMP/${UPDATE_NOTES_NAME}"
          if gh release view "$UPDATE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING_DIR="$RUNNER_TEMP/existing-sparkle-updates"
            mkdir -p "$EXISTING_DIR"
            gh release download "$UPDATE_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'senor-particle-update-v*.zip' \
              --pattern 'senor-particle-update-v*.md' \
              --dir "$EXISTING_DIR"
            cp "$EXISTING_DIR"/* "$APPCAST_INPUT_DIR"/
          fi
          cp "$RUNNER_TEMP/${UPDATE_ARCHIVE_NAME}" "$APPCAST_INPUT_DIR/${UPDATE_ARCHIVE_NAME}"
          cp "$RUNNER_TEMP/${UPDATE_NOTES_NAME}" "$APPCAST_INPUT_DIR/${UPDATE_NOTES_NAME}"

      - name: Validate Sparkle Build Number
        run: |
          set -euo pipefail
          EXISTING_APPCAST="$RUNNER_TEMP/appcast.xml"
          HTTP_STATUS="$(curl --silent --show-error --location \
            "https://heikopanjas.github.io/senor-particle/appcast.xml" \
            --output "$EXISTING_APPCAST" \
            --write-out '%{http_code}')"
          if [[ "$HTTP_STATUS" == "200" ]]; then
            LATEST_BUILD="$(python3 - "$EXISTING_APPCAST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          namespace = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          root = ET.parse(sys.argv[1]).getroot()
          versions = [
              int(element.text)
              for element in root.findall(".//sparkle:version", namespace)
              if element.text and element.text.isdigit()
          ]
          print(max(versions, default=0))
          PY
          )"
            if (( BUILD_NUMBER <= LATEST_BUILD )); then
              echo "Build $BUILD_NUMBER must be newer than appcast build $LATEST_BUILD" >&2
              exit 1
            fi
          elif [[ "$HTTP_STATUS" == "404" ]]; then
            echo "No published appcast found; treating this as the bootstrap release"
          else
            echo "Appcast request returned HTTP $HTTP_STATUS" >&2
            exit 1
          fi

      - name: Generate Signed Sparkle Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_ED_PRIVATE_KEY:?Missing SPARKLE_ED_PRIVATE_KEY secret}"
          GENERATE_APPCAST="$PACKAGE_CACHE_DIR/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [[ ! -x "$GENERATE_APPCAST" ]]; then
            echo "Sparkle generate_appcast tool is missing at $GENERATE_APPCAST" >&2
            find "$PACKAGE_CACHE_DIR" -maxdepth 5 -type f -name generate_appcast -print >&2 || true
            exit 1
          fi
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${UPDATE_RELEASE_TAG}/" \
            --embed-release-notes \
            --maximum-deltas 0 \
            --maximum-versions 0 \
            -o "$APPCAST_PATH" \
            "$APPCAST_INPUT_DIR"

      - name: Validate Sparkle Appcast
        run: |
          set -euo pipefail
          python3 - "$APPCAST_PATH" "$APP_VERSION" "$BUILD_NUMBER" "$UPDATE_ARCHIVE_NAME" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path, expected_version, expected_build, expected_archive = sys.argv[1:]
          namespace = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          appcast_text = open(path, encoding="utf-8").read()
          root = ET.parse(path).getroot()
          matching_items = []
          for item in root.findall(".//item"):
              version = item.findtext("sparkle:version", namespaces=namespace)
              short_version = item.findtext("sparkle:shortVersionString", namespaces=namespace)
              enclosure = item.find("enclosure")
              if version == expected_build and short_version == expected_version and enclosure is not None:
                  matching_items.append(enclosure)
          if len(matching_items) != 1:
              raise SystemExit("Expected exactly one current update in appcast")
          enclosure = matching_items[0]
          url = enclosure.get("url", "")
          if not url.startswith("https://") or not url.endswith("/" + expected_archive):
              raise SystemExit(f"Unexpected enclosure URL: {url}")
          signature = enclosure.get("{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature", "")
          if not signature:
              raise SystemExit("Current update is missing its EdDSA signature")
          item = next(
              item
              for item in root.findall(".//item")
              if item.findtext("sparkle:version", namespaces=namespace) == expected_build
          )
          minimum_system_version = item.findtext("sparkle:minimumSystemVersion", namespaces=namespace)
          hardware_requirements = item.findtext("sparkle:hardwareRequirements", namespaces=namespace)
          if minimum_system_version != "15.7" or hardware_requirements != "arm64":
              raise SystemExit("Appcast contains unexpected platform requirements")
          if "<!-- sparkle-signatures:" not in appcast_text or "edSignature:" not in appcast_text:
              raise SystemExit("Appcast is missing its signed-feed signature")
          PY
          xmllint --noout "$APPCAST_PATH"
          ls -lh "$APPCAST_PATH"

      - name: Stage Sparkle Publication
        run: |
          set -euo pipefail
          rm -rf "$UPDATE_PUBLICATION_DIR"
          mkdir -p "$UPDATE_PUBLICATION_DIR"
          cp "$APPCAST_PATH" "$UPDATE_PUBLICATION_DIR/appcast.xml"
          cp "${APPCAST_INPUT_DIR}/${UPDATE_ARCHIVE_NAME}" "$UPDATE_PUBLICATION_DIR/${UPDATE_ARCHIVE_NAME}"
          cp "${APPCAST_INPUT_DIR}/${UPDATE_NOTES_NAME}" "$UPDATE_PUBLICATION_DIR/${UPDATE_NOTES_NAME}"

      - name: Upload App Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}
          if-no-files-found: error

      - name: Upload Sparkle Publication Artifact
        uses: actions/upload-artifact@v6
        with:
          name: sparkle-${{ env.RELEASE_NAME }}
          path: ${{ env.UPDATE_PUBLICATION_DIR }}
          if-no-files-found: error

      - name: Clean Up Signing Material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/developer-id-application.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - release
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download Notarized App Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.release_name }}
          path: dist

      - name: Download Sparkle Publication Artifact
        uses: actions/download-artifact@v8
        with:
          name: sparkle-${{ needs.release.outputs.release_name }}
          path: sparkle

      - name: Publish GitHub Release
        env:
          APP_VERSION: ${{ needs.release.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.release.outputs.release_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${APP_VERSION}"
          ARTIFACT_PATH="dist/${RELEASE_NAME}.zip"
          if [[ ! -f "$ARTIFACT_PATH" ]]; then
            echo "Release artifact not found at $ARTIFACT_PATH" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_TARGET="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            if [[ "$RELEASE_TARGET" != "$GITHUB_SHA" ]]; then
              echo "Release $RELEASE_TAG targets $RELEASE_TARGET instead of $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$ARTIFACT_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARTIFACT_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Senor Particle ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Publish Sparkle Update Assets
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_ARCHIVE_NAME: ${{ needs.release.outputs.update_archive_name }}
          UPDATE_NOTES_NAME: ${{ needs.release.outputs.update_notes_name }}
        run: |
          set -euo pipefail
          UPDATE_ARCHIVE_PATH="sparkle/${UPDATE_ARCHIVE_NAME}"
          UPDATE_NOTES_PATH="sparkle/${UPDATE_NOTES_NAME}"
          if [[ ! -f "$UPDATE_ARCHIVE_PATH" || ! -f "$UPDATE_NOTES_PATH" ]]; then
            echo "Sparkle publication assets are missing" >&2
            exit 1
          fi
          if gh release view "$UPDATE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$UPDATE_RELEASE_TAG" \
              "$UPDATE_ARCHIVE_PATH" \
              "$UPDATE_NOTES_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$UPDATE_RELEASE_TAG" \
              "$UPDATE_ARCHIVE_PATH" \
              "$UPDATE_NOTES_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Sparkle Update Assets" \
              --notes "Machine-readable update archives for the Sparkle appcast." \
              --prerelease
          fi

  pages:
    name: Publish Sparkle Appcast
    if: github.event_name == 'push'
    needs:
      - release
      - publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Sparkle Publication Artifact
        uses: actions/download-artifact@v8
        with:
          name: sparkle-${{ needs.release.outputs.release_name }}
          path: sparkle

      - name: Prepare Pages Artifact
        run: |
          set -euo pipefail
          mkdir -p pages
          cp sparkle/appcast.xml pages/appcast.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
